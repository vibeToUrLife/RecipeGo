name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref (a push to a PR branch would otherwise
# start both a push and a pull_request run).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
        env:
          # next build never connects to Supabase; these only need to be defined
          # so env access during the build doesn't throw. Not real credentials.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key

  # The database's own tests: every migration in supabase/migrations applied to
  # a fresh Supabase database (Docker comes with GitHub's runners), then the
  # pgTAP checks in supabase/tests on who can see and change what.
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - run: supabase db start
      - run: supabase test db

  # The database's CD: once all of the above has passed on master, migrations
  # not yet on the live Supabase database are applied to it (supabase db push).
  # Vercel deploys the app itself straight away, so the code a migration comes
  # with runs a few minutes before the migration lands, and has to cope.
  #
  # It does nothing until the repository has three secrets (SETUP.md,
  # "Optional: deploy database changes automatically"). And it stops rather
  # than apply every migration again to a database set up by pasting SQL into
  # the SQL editor, whose history of applied migrations is empty: that takes
  # the one-time "Baseline the database" workflow first.
  migrate:
    needs: [verify, database]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID_AS_SET: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check for the secrets
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$PROJECT_ID_AS_SET" ]; then
            echo "::notice::Migrations weren't deployed: the SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD and SUPABASE_PROJECT_ID secrets aren't all set (SETUP.md)."
            exit 0
          fi
          # The project's reference: 20 lowercase letters, as in
          # https://<ref>.supabase.co. Taken from a whole address too (that one,
          # or the dashboard's), with any spaces dropped: both are easy to paste.
          ref=$(printf '%s' "$PROJECT_ID_AS_SET" | tr -d '[:space:]' | sed -E 's#^https?://##; s#\.supabase\.co.*$##; s#^.*/project/##; s#/.*$##')
          if ! [[ "$ref" =~ ^[a-z]{20}$ ]]; then
            echo "::error::The SUPABASE_PROJECT_ID secret should be the project's reference: the 20 lowercase letters in its address, https://<these>.supabase.co (Supabase → Project Settings → General → Project ID). What's set comes to ${#ref} characters that aren't that."
            exit 1
          fi
          echo "SUPABASE_PROJECT_ID=$ref" >> "$GITHUB_ENV"
          echo "set=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.set == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.set == 'true'
        with:
          version: 2.122.1
      - name: Link the live project
        if: steps.secrets.outputs.set == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: List what would be applied
        if: steps.secrets.outputs.set == 'true'
        run: |
          supabase db push --linked --dry-run 2>&1 | tee plan.txt
          # The very first migration still to apply means the live database's
          # history was never recorded, not that it's empty.
          if grep -q 20260628073134 plan.txt; then
            echo "::error::The live database has no record of its migrations, so this would apply them all again. Run the \"Baseline the database\" workflow once first (SETUP.md)."
            exit 1
          fi
      - name: Apply them
        if: steps.secrets.outputs.set == 'true'
        run: supabase db push --linked

  # The site's CD, after the database's: once migrate has applied what the new
  # code needs, this commit goes to Vercel as the production deployment. So no
  # one gets a page that asks for a table that isn't there yet, and nothing that
  # fails CI goes live. Vercel builds it, with the project's own environment
  # variables, which never come here.
  #
  # It does nothing until the repository has three more secrets (SETUP.md,
  # "Optional: deploy the site after the database"), and until then Vercel's
  # own deploy on every push carries on. Once this has worked, vercel.json turns
  # that off for master, so this is the only way master goes live.
  deploy:
    needs: [migrate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      ORG_ID_AS_SET: ${{ secrets.VERCEL_ORG_ID }}
      PROJECT_ID_AS_SET: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check for the secrets
        id: secrets
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$ORG_ID_AS_SET" ] || [ -z "$PROJECT_ID_AS_SET" ]; then
            echo "::notice::The site wasn't deployed from CI: the VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID secrets aren't all set (SETUP.md)."
            exit 0
          fi
          # Spaces dropped, as they're easy to paste along with an ID.
          org=$(printf '%s' "$ORG_ID_AS_SET" | tr -d '[:space:]')
          project=$(printf '%s' "$PROJECT_ID_AS_SET" | tr -d '[:space:]')
          if ! [[ "$project" =~ ^prj_[A-Za-z0-9]+$ ]]; then
            echo "::error::The VERCEL_PROJECT_ID secret should be the project's ID, which starts prj_ (Vercel → the project → Settings → General → Project ID)."
            exit 1
          fi
          echo "VERCEL_ORG_ID=$org" >> "$GITHUB_ENV"
          echo "VERCEL_PROJECT_ID=$project" >> "$GITHUB_ENV"
          echo "set=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.set == 'true'
      - name: Deploy to production
        if: steps.secrets.outputs.set == 'true'
        run: npx --yes vercel@65.3.1 deploy --prod --yes --token "$VERCEL_TOKEN"
