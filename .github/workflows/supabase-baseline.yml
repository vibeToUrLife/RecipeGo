name: Baseline the database

# Run once, by hand (Actions → Baseline the database → Run workflow), for a
# live database set up by pasting setup_all.sql or migrations into the SQL
# editor. Its record of applied migrations is empty, so CI's migrate job
# would try to apply them all again; this records every migration up to the
# one given as applied already, without running any. After that, CI applies
# only the new ones.
on:
  workflow_dispatch:
    inputs:
      through:
        description: The number of the newest migration the live database already has, e.g. 20261103120000
        required: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID_AS_SET: ${{ secrets.SUPABASE_PROJECT_ID }}
      THROUGH: ${{ inputs.through }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      - name: Check the migration number
        run: |
          if ! [[ "$THROUGH" =~ ^[0-9]{14}$ ]] || ! ls supabase/migrations/"$THROUGH"_*.sql >/dev/null 2>&1; then
            echo "::error::\"$THROUGH\" isn't the number of a migration in supabase/migrations."
            exit 1
          fi
      - name: Check the project ID
        run: |
          # The project's reference: 20 lowercase letters, as in
          # https://<ref>.supabase.co. Taken from a whole address too (that one,
          # or the dashboard's), with any spaces dropped: both are easy to paste.
          ref=$(printf '%s' "$PROJECT_ID_AS_SET" | tr -d '[:space:]' | sed -E 's#^https?://##; s#\.supabase\.co.*$##; s#^.*/project/##; s#/.*$##')
          if ! [[ "$ref" =~ ^[a-z]{20}$ ]]; then
            echo "::error::The SUPABASE_PROJECT_ID secret should be the project's reference: the 20 lowercase letters in its address, https://<these>.supabase.co (Supabase → Project Settings → General → Project ID). What's set comes to ${#ref} characters that aren't that."
            exit 1
          fi
          echo "SUPABASE_PROJECT_ID=$ref" >> "$GITHUB_ENV"
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Record them as applied
        run: |
          versions=()
          for file in supabase/migrations/*.sql; do
            version=$(basename "$file" | cut -d_ -f1)
            if (( 10#$version <= 10#$THROUGH )); then versions+=("$version"); fi
          done
          echo "Recording ${#versions[@]} migrations as applied, through $THROUGH"
          supabase migration repair --linked --status applied "${versions[@]}"
      - name: Show the history now
        run: supabase migration list --linked
